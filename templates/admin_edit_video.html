<!DOCTYPE html>
<html lang="uz">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Tahrirlash – Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f1f5f9; }
    .container { max-width: 700px; margin: 40px auto; background: white; border-radius: 16px; padding: 30px; }
  </style>
  <link rel="stylesheet" href="/static/admin2.css?v=1">
  <script src="/static/admin2.js?v=1" defer></script>
</head>
<body>
<div class="container">
<div class="admin2-return"><a href="/admin/dashboard">← Boshqaruv markaziga qaytish</a><span>ITube Admin 2.0</span></div>
  <h4>Tahrirlash: #{{ .Video.ID }}</h4>
  <form method="post" action="/admin/videos/edit/{{ .Video.ID }}">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <div class="mb-3"><label class="form-label">Sarlavha</label><input type="text" name="title" class="form-control" value="{{ .Video.Title }}" required></div>
    <div class="mb-3"><label class="form-label">Tavsif</label><textarea name="body" class="form-control" rows="4">{{ .Video.Body }}</textarea></div>
    <div class="mb-3"><label class="form-label">Video URL</label><input type="text" name="video_url" class="form-control" value="{{ .Video.VideoURL }}"></div>
    <div class="mb-3"><label class="form-label">Kategoriya</label><select name="category_id" class="form-select">{{ range .Categories }}<option value="{{ .ID }}" {{ if eq .ID $.Video.CategoryID }}selected{{ end }}>{{ .Name }}</option>{{ end }}</select></div>
    <div class="mb-3"><label class="form-label">Holat</label><select name="status" class="form-select"><option value="DR" {{ if eq .Video.Status "DR" }}selected{{ end }}>Qoralama</option><option value="PB" {{ if eq .Video.Status "PB" }}selected{{ end }}>Nashr</option></select></div>
    <button type="submit" class="btn btn-primary">Saqlash</button>
    <a href="/admin/videos" class="btn btn-outline-secondary">Bekor qilish</a>
  </form>
</div>
</body>
</html>
