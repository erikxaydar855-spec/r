<!DOCTYPE html>
<html>
<head>
  <title>Maktablar – Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body { background: #f1f5f9; }
    .sidebar { background: #0f172a; min-height: 100vh; padding: 20px 0; }
    .sidebar .nav-link { color: #94a3b8; border-radius: 8px; padding: 12px 20px; margin: 4px 12px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1e293b; color: white; }
    .sidebar .nav-link i { margin-right: 12px; }
    .main-content { padding: 30px; }
  </style>
</head>
<body>
<div class="container-fluid p-0">
  <div class="row g-0">
    <div class="col-md-3 col-lg-2 sidebar">
      <div class="text-center text-white py-3">
        <h4><i class="bi bi-camera-video"></i> ITube</h4>
        <small class="text-secondary">Admin panel</small>
      </div>
      <hr class="border-secondary">
      <nav class="nav flex-column">
        <a href="/admin/videos" class="nav-link"><i class="bi bi-collection-play"></i> Videolar</a>
        <a href="/admin/manage" class="nav-link"><i class="bi bi-building-gear"></i> Maktab va sinflar</a>
        <a href="/admin/schools" class="nav-link active"><i class="bi bi-building"></i> Maktablar ro'yxati</a>
        <a href="/" class="nav-link"><i class="bi bi-globe2"></i> Saytga o‘tish</a>
        <a href="/logout" class="nav-link"><i class="bi bi-box-arrow-right"></i> Chiqish</a>
      </nav>
    </div>
    <div class="col-md-9 col-lg-10 main-content">
      <h2><i class="bi bi-building text-primary"></i> Barcha maktablar</h2>
      <div class="card shadow-sm mt-4">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead><tr><th>#</th><th>Maktab nomi</th><th>Viloyat</th><th>Email</th><th>Sinflar</th><th></th></tr></thead>
            <tbody>
              {{ range .Users }}
              <tr>
                <td>{{ .ID }}</td>
                <td>{{ .Username }}</td>
                <td>{{ .Region }}</td>
                <td>{{ .Email }}</td>
                <td><span class="badge bg-primary">{{ .ClassCount }}</span></td>
                <td><a href="/admin/schools/{{ .ID }}" class="btn btn-sm btn-primary">Batafsil</a></td>
              </tr>
              {{ else }}
              <tr><td colspan="6" class="text-center py-4">Hali maktablar yo‘q</td></tr>
              {{ end }}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
