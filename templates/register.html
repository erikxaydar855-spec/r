<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITube | Ro‘yxatdan o‘tish</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      max-width: 440px; width: 100%; background: #fff;
      border-radius: 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      padding: 40px 36px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand i { font-size: 28px; color: #3b82f6; }
    .brand span { font-weight: 800; font-size: 22px; color: #0f172a; }
    h1 { font-size: 28px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
    .sub { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-weight: 600; font-size: 13px;
      color: #1e293b; margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 13px 16px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 15px; font-family: inherit;
      background: #f8fafc; transition: 0.2s;
    }
    .form-group input:focus {
      outline: none; border-color: #3b82f6;
      background: #fff; box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
    }
    .btn-primary {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none; border-radius: 12px; color: #fff;
      font-weight: 700; font-size: 15px; cursor: pointer;
      transition: 0.2s; font-family: inherit; margin-top: 6px;
      box-shadow: 0 8px 20px rgba(59,130,246,0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .back-link { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
    .back-link a { color: #3b82f6; font-weight: 700; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
    .error-msg {
      background: #fee2e2; color: #b91c1c;
      padding: 12px 16px; border-radius: 12px;
      margin-bottom: 16px; font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    /* Same glass visual language as the new sign-in page. */
    body {background:radial-gradient(circle at 12% 8%,rgba(57,126,245,.33),transparent 32%),radial-gradient(circle at 90% 85%,rgba(32,176,216,.25),transparent 35%),linear-gradient(135deg,#070f26,#132d4b);}
    .container {background:rgba(245,249,255,.84);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.76);box-shadow:0 26px 72px rgba(0,0,0,.27);}
    .form-group input:focus,.form-group select:focus{outline:0;border-color:#4287f5;box-shadow:0 0 0 4px rgba(66,135,245,.13)}
  </style>
<style id="itube-eye-fix">
.password-field,
.password-wrap,
.password-box,
.input-with-eye,
.password-input-wrap {
    position: relative !important;
}

.password-field input,
.password-wrap input,
.password-box input,
.input-with-eye input,
.password-input-wrap input {
    padding-right: 54px !important;
}

.password-field .toggle-password,
.password-wrap .toggle-password,
.password-box .toggle-password,
.input-with-eye .toggle-password,
.password-input-wrap .toggle-password,
.password-field .password-toggle,
.password-wrap .password-toggle,
.password-box .password-toggle,
.input-with-eye .password-toggle,
.password-input-wrap .password-toggle,
.password-field .eye-btn,
.password-wrap .eye-btn,
.password-box .eye-btn,
.input-with-eye .eye-btn,
.password-input-wrap .eye-btn {
    position: absolute !important;
    right: 12px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    width: 32px !important;
    height: 32px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    cursor: pointer !important;
    z-index: 20 !important;
    opacity: 0.85 !important;
}

.password-field .toggle-password i,
.password-wrap .toggle-password i,
.password-box .toggle-password i,
.input-with-eye .toggle-password i,
.password-input-wrap .toggle-password i,
.password-field .password-toggle i,
.password-wrap .password-toggle i,
.password-box .password-toggle i,
.input-with-eye .password-toggle i,
.password-input-wrap .password-toggle i,
.password-field .eye-btn i,
.password-wrap .eye-btn i,
.password-box .eye-btn i,
.input-with-eye .eye-btn i,
.password-input-wrap .eye-btn i {
    pointer-events: none !important;
}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <i class="fas fa-graduation-cap"></i>
    <span>ITube</span>
  </div>
  <h1>Hisob yaratish</h1>
  <p class="sub">Faqat foydalanuvchilar uchun. Maktab va sinf hisoblari maktab ma’muriyati tomonidan beriladi.</p>

  {{ if .Error }}
  <div class="error-msg">
    <i class="fas fa-exclamation-circle"></i> {{ .Error }}
  </div>
  {{ end }}

  <form method="post" action="/account/register">
    <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
    <div class="form-group">
      <label>👤 Username</label>
      <input type="text" name="username" placeholder="Foydalanuvchi nomingiz" required minlength="3" autocomplete="username">
    </div>
    <div class="form-group"><label>📧 Email (siz yoki ota-onangizniki)</label><input type="email" name="email" placeholder="example@gmail.com" autocomplete="email" required></div>
    <div class="form-group"><label>📍 Viloyat</label>
      <select name="region" required style="width:100%;padding:13px;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;font-size:15px">
        <option value="">Viloyatingizni tanlang</option>
        <option value="Toshkent shahri">Toshkent shahri</option>
        <option value="Toshkent">Toshkent</option>
        <option value="Samarqand">Samarqand</option>
        <option value="Buxoro">Buxoro</option>
        <option value="Navoiy">Navoiy</option>
        <option value="Farg'ona">Farg'ona</option>
        <option value="Namangan">Namangan</option>
        <option value="Andijon">Andijon</option>
        <option value="Qashqadaryo">Qashqadaryo</option>
        <option value="Surxondaryo">Surxondaryo</option>
        <option value="Xorazm">Xorazm</option>
        <option value="Qoraqalpog'iston">Qoraqalpog'iston</option>
        <option value="Sirdaryo">Sirdaryo</option>
        <option value="Jizzax">Jizzax</option>
      </select></div>
    <div class="form-group">
      <label>🔒 Parol</label>
      <input type="password" name="password" placeholder="Kamida 12 belgi" required minlength="12" autocomplete="new-password">
    </div>
    <button type="submit" class="btn-primary">Ro‘yxatdan o‘tish →</button>
  </form>

  <div class="back-link">
    Hisobingiz bormi? <a href="/auth">Kirish</a>
  </div>
</div>
<script src="/static/password-eye.js?v=1" defer></script>
</body>
</html>
