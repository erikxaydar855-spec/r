<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil – ITube</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Inter', sans-serif; background: #f6f9fc; color: #1e293b; }
    .container { max-width: 700px; margin: 40px auto; background: white; border-radius: 24px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .profile-header { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
    .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: #e2e8f0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #94a3b8; border: 3px solid #e2e8f0; flex-shrink: 0; }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-avatar-upload { display: flex; flex-direction: column; gap: 8px; }
    .profile-avatar-upload label { font-weight: 600; font-size: 14px; }
    .file-input-wrapper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .file-input-wrapper input[type="file"] { display: none; }
    .file-input-wrapper .file-label { background: #e2e8f0; padding: 8px 16px; border-radius: 30px; font-weight: 500; font-size: 14px; cursor: pointer; }
    .file-input-wrapper .file-label:hover { background: #cbd5e1; }
    .file-input-wrapper .file-name { font-size: 14px; color: #64748b; }
    .profile-avatar-upload button { background: #3b82f6; color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; width: fit-content; }
    .field-group { margin-bottom: 20px; }
    .field-group label { display: block; font-weight: 600; font-size: 14px; color: #1e293b; margin-bottom: 4px; }
    .field-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: #f8fafc; }
    .field-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.12); }
    .field-group .info-text { font-size: 14px; color: #64748b; margin-top: 4px; }
    .btn-primary { background: #3b82f6; color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; }
    .btn-primary:hover { background: #2563eb; }
    .back-link { display: inline-block; margin-top: 20px; color: #3b82f6; text-decoration: none; font-weight: 600; }
    .message { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: none; }
    .message.success { background: #dcfce7; color: #166534; display: block; }
    .message.error { background: #fee2e2; color: #b91c1c; display: block; }
  </style>
</head>
<body>
<div class="container">
  <h2><i class="fas fa-user-cog"></i> Profil sozlamalari</h2>
  <p style="color:#64748b; margin-bottom:24px;">Shaxsiy maʼlumotlaringizni boshqaring</p>

  <div id="message" class="message"></div>

  <div class="profile-header">
    <div class="profile-avatar" id="avatarPreview">
      {{ if .Avatar }}<img src="{{ .Avatar }}" alt="avatar">{{ else }}<i class="fas fa-user-circle"></i>{{ end }}
    </div>
    <div class="profile-avatar-upload">
      <label>Rasm yuklash</label>
      <div class="file-input-wrapper">
        <label for="avatarInput" class="file-label">📁 Fayl tanlang</label>
        <input type="file" id="avatarInput" accept="image/*">
        <span class="file-name" id="fileName">Fayl tanlanmagan</span>
        <button id="uploadAvatarBtn">Yuklash</button>
      </div>
    </div>
  </div>

  <div class="field-group">
    <label>👤 Username</label>
    <input type="text" value="{{ .Username }}" disabled>
    <div class="info-text">Bu sizning tizimdagi asosiy nomingiz (o‘zgartirib bo‘lmaydi)</div>
  </div>

  <div class="field-group">
    <label>🏫 Maktab / Sinf</label>
    <input type="text" value="{{ .SchoolOrClass }}" disabled>
    <div class="info-text">Ro‘yxatdan o‘tgan maktab yoki sinf</div>
  </div>

  <div class="field-group"><label>🔒 Joriy parol</label><input type="password" id="currentPassword" placeholder="Joriy parol"></div>
  <div class="field-group"><label>🔒 Yangi parol</label><input type="password" id="newPassword" placeholder="Yangi parol (6+ belgi)"></div>
  <div class="field-group"><label>🔒 Yangi parolni tasdiqlang</label><input type="password" id="confirmPassword" placeholder="Yangi parolni qayta kiriting"></div>

  <button id="updatePasswordBtn" class="btn-primary">Parolni yangilash</button>

  {{ if eq .Role "class" }}
    <hr style="margin: 24px 0;">
    <h3>📚 Sinf maʼlumotlari</h3>
    <div class="field-group"><label>🔢 Sinf raqami</label><input type="number" id="classNumber" value="{{ .ClassNumber }}"></div>
    <div class="field-group"><label>🔤 Sinf harfi</label><input type="text" id="classLetter" value="{{ .ClassLetter }}" maxlength="1"></div>
    <div class="field-group"><label>👨‍🏫 Sinf sardori</label><input type="text" id="classLeader" value="{{ .ClassLeader }}"></div>
    <button id="updateClassBtn" class="btn-primary">Sinf maʼlumotlarini yangilash</button>
  {{ end }}

  <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Bosh sahifaga qaytish</a>
</div>

<script>
  (function() {
    const avatarInput = document.getElementById('avatarInput');
    const uploadBtn = document.getElementById('uploadAvatarBtn');
    const avatarPreview = document.getElementById('avatarPreview');
    const messageDiv = document.getElementById('message');
    const fileNameSpan = document.getElementById('fileName');

    avatarInput.addEventListener('change', function() {
      fileNameSpan.textContent = (this.files && this.files[0]) ? this.files[0].name : 'Fayl tanlanmagan';
    });

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = 'message ' + type;
      setTimeout(() => { messageDiv.className = 'message'; }, 5000);
    }

    uploadBtn.addEventListener('click', function() {
      const file = avatarInput.files[0];
      if (!file) { showMessage('Iltimos, rasm tanlang.', 'error'); return; }
      const formData = new FormData();
      formData.append('avatar', file);
      fetch('/profile/avatar', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            showMessage('Rasm muvaffaqiyatli yuklandi!', 'success');
            avatarPreview.innerHTML = `<img src="${data.avatar}?t=${Date.now()}" alt="avatar">`;
            fileNameSpan.textContent = 'Fayl tanlanmagan';
            avatarInput.value = '';
          } else {
            showMessage('Xatolik: ' + (data.error || 'nomaʼlum'), 'error');
          }
        })
        .catch(() => showMessage('Server xatosi.', 'error'));
    });

    document.getElementById('updatePasswordBtn').addEventListener('click', function() {
      const current = document.getElementById('currentPassword').value;
      const newP = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (!current || !newP || !confirm) { showMessage('Barcha maydonlarni toʻldiring.', 'error'); return; }
      if (newP.length < 6) { showMessage('Yangi parol kamida 6 belgi.', 'error'); return; }
      if (newP !== confirm) { showMessage('Parollar mos kelmadi.', 'error'); return; }
      fetch('/profile/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current: current, new: newP })
      })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            showMessage('Parol muvaffaqiyatli yangilandi!', 'success');
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
          } else {
            showMessage('Xatolik: ' + (data.error || 'nomaʼlum'), 'error');
          }
        })
        .catch(() => showMessage('Server xatosi.', 'error'));
    });

    const updateClassBtn = document.getElementById('updateClassBtn');
    if (updateClassBtn) {
      updateClassBtn.addEventListener('click', function() {
        const data = {
          class_number: parseInt(document.getElementById('classNumber').value) || 0,
          class_letter: document.getElementById('classLetter').value,
          class_leader: document.getElementById('classLeader').value
        };
        fetch('/profile/class', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'ok') showMessage('Sinf maʼlumotlari yangilandi!', 'success');
            else showMessage('Xatolik: ' + (data.error || 'nomaʼlum'), 'error');
          })
          .catch(() => showMessage('Server xatosi.', 'error'));
      });
    }
  })();
</script>
</body>
</html>
